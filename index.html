<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Internal prototype: keep it out of search results and link previews. robots.txt
         stops the crawl; this stops an already-indexed URL from being listed, which
         robots.txt alone cannot do. Remove both when the real site launches. -->
    <meta name="robots" content="noindex, nofollow" />
    <script>
      (() => {
        // The /try funnels are the public website and are light-only. Dark mode is a
        // preference of the signed-in web app, so it must not paint them, not even for
        // the frame before the app mounts.
        if (window.location.pathname.includes('/try/')) {
          document.documentElement.dataset.theme = 'light';
          return;
        }
        const stored = window.localStorage.getItem('jobwhisper-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored;
        } else {
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = prefersDark ? 'dark' : 'light';
        }
      })();
    </script>
    <title>Jobwhisper</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
